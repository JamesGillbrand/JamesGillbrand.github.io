<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>

  {% seo %}

  <!-- Base styling -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  <style>
    .graph-container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 1rem;
    }
    .graph {
      margin-bottom: 3rem;
    }
    .graph img {
      width: 100%;
      height: auto;
      border: 1px solid #ccc;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .caption {
      font-size: 0.95rem;
      font-style: italic;
      color: #666;
      margin-top: 0.5rem;
    }
    h1, h2 {
      font-family: system-ui, sans-serif;
    }
  </style>

  {% include head-custom.html %}
</head>
<body>
  <div class="graph-container">
    <header>
      <h1>{{ page.title }}</h1>
      {% if page.description %}
        <p>{{ page.description }}</p>
      {% endif %}
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      <p><small>© {{ site.time | date: "%Y" }} {{ site.title }}. Built with <a href="https://jekyllrb.com">Jekyll</a>.</small></p>
    </footer>
  </div>
</body>
</html>
